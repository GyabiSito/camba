name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ steps.scope.outputs.api }}
      web: ${{ steps.scope.outputs.web }}
      infra: ${{ steps.scope.outputs.infra }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'unknown' }}
        run: bash infra/ci/changes.sh "$BASE" HEAD >> "$GITHUB_OUTPUT"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: camba_v2_test
          MYSQL_USER: camba_v2
          MYSQL_PASSWORD: camba-ci-only
          MYSQL_ROOT_PASSWORD: camba-ci-root-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysql --protocol=TCP -h 127.0.0.1 -ucamba_v2 -pcamba-ci-only camba_v2_test -e 'SELECT 1'"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: camba_v2_test
      DB_USERNAME: camba_v2
      DB_PASSWORD: camba-ci-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite
          coverage: none
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php vendor/bin/pint --test
      - name: Run PHPUnit against isolated MySQL
        env:
          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          export APP_KEY="$(php artisan key:generate --show)"
          php vendor/bin/phpunit

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Check the Angular workspace tooling
        run: npm exec -- ng version

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker compose -f infra/compose.dev.yml config --quiet
      - run: bash infra/ci/checks.test.sh

  required:
    name: Required checks
    if: ${{ always() }}
    needs: [changes, api, web, infra]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          API_NEEDED: ${{ needs.changes.outputs.api }}
          API_RESULT: ${{ needs.api.result }}
          WEB_NEEDED: ${{ needs.changes.outputs.web }}
          WEB_RESULT: ${{ needs.web.result }}
          INFRA_NEEDED: ${{ needs.changes.outputs.infra }}
          INFRA_RESULT: ${{ needs.infra.result }}
        run: bash infra/ci/required.sh
