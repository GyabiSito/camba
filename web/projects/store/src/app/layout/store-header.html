<header class="home-header" id="arriba" tabindex="-1">
  <nav class="home-nav" aria-label="Tienda">
    <button type="button" class="menu-trigger" popovertarget="home-menu" aria-label="Menú de tienda">Menú</button>
    <a class="direct-home" routerLink="/" [class.active]="home()" [attr.aria-current]="home() ? 'page' : null">Inicio</a>
    <a class="direct-shop" routerLink="/tienda" routerLinkActive="active" ariaCurrentWhenActive="page">Tienda</a>
    <div class="home-popover" id="home-menu" popover="auto" #menu>
      <a routerLink="/" [class.active]="home()" [attr.aria-current]="home() ? 'page' : null" (click)="menu.hidePopover()">Inicio</a>
      <a routerLink="/tienda" (click)="menu.hidePopover()">Tienda</a>
      <a routerLink="/cuenta" (click)="menu.hidePopover()">Mi cuenta</a>
      <a routerLink="/contacto" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" (click)="menu.hidePopover()">Contacto</a>
    </div>
  </nav>
  <a class="home-wordmark" routerLink="/" aria-label="Camba, inicio">
    <img class="home-brand" src="/brand/camba.svg" width="1024" height="477" alt="" />
  </a>
  <nav class="home-utilities" aria-label="Tu compra">
    <a routerLink="/tienda" aria-label="Buscar">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.55" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5" /><path d="m16 16 4 4" />
      </svg><span>Buscar</span>
    </a>
    <a class="header-account" routerLink="/cuenta" aria-label="Mi cuenta">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.55" aria-hidden="true">
        <circle cx="12" cy="7.5" r="3.3" /><path d="M5.5 21v-2a6.5 6.5 0 0 1 13 0v2" />
      </svg><span>Mi cuenta</span>
    </a>
    <a class="header-contact" routerLink="/contacto" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" aria-label="Contacto">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2" /><path d="m4 7 8 6 8-6" />
      </svg><span>Contacto</span>
    </a>
    <a routerLink="/carrito" [attr.aria-label]="count() ? 'Carrito, ' + count() : 'Carrito'">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.55" aria-hidden="true">
        <path d="M5 8h14l1 13H4L5 8Zm4 2V6a3 3 0 0 1 6 0v4" />
      </svg><span>Carrito</span>
      @if (count()) { <span class="count" aria-live="polite">{{ count() }}</span> }
    </a>
  </nav>
</header>
