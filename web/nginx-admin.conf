server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control no-store;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control no-cache;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
