resolver 127.0.0.11 valid=2s ipv6=off;
map $server_port $frontend {
    8080 http://store:4000;
    8081 http://admin:8080;
}
server {
    listen 8080;
    listen 8081;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto http;
    location ~ ^/(api/|sanctum/|email/|storage/|ready$) {
        set $api http://api:8080;
        proxy_pass $api;
    }
    location / { proxy_pass $frontend; }
}
