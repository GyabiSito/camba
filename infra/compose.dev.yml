name: camba-v2-dev

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: camba_v2
      MYSQL_USER: camba_v2
      MYSQL_PASSWORD: ${CAMBA_DEV_DB_PASSWORD:-camba-local-db}
      MYSQL_ROOT_PASSWORD: ${CAMBA_DEV_DB_ROOT_PASSWORD:-camba-local-root}
    ports:
      - '127.0.0.1:${CAMBA_DEV_MYSQL_PORT:-43306}:3306'
    volumes:
      - mysql:/var/lib/mysql
      - ./dev/mysql/create-test-schema.sql:/docker-entrypoint-initdb.d/10-test-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 3s
      timeout: 5s
      retries: 25

  redis:
    image: redis:7.2.16-alpine3.21
    ports:
      - '127.0.0.1:${CAMBA_DEV_REDIS_PORT:-46379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - '127.0.0.1:${CAMBA_DEV_SMTP_PORT:-41025}:1025'
      - '127.0.0.1:${CAMBA_DEV_MAIL_UI_PORT:-48025}:8025'

volumes:
  mysql:
