# HTTP ingress for the disposable, loopback-only PostgreSQL candidate.
# Do not install this overlay on the VPS.
services:
  api-fpm:
    environment:
      SESSION_SECURE_COOKIE: 'false'
      CAMBA_PG_REHEARSAL: '1'
  ingress:
    image: ${CAMBA_ADMIN_IMAGE:?Use the local candidate Admin image}
    entrypoint: [nginx, -e, stderr, -g, 'daemon off;']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - '127.0.0.1:${CAMBA_REHEARSAL_STORE_PORT:?Set a disposable loopback port}:8080'
      - '127.0.0.1:${CAMBA_REHEARSAL_ADMIN_PORT:?Set a disposable loopback port}:8081'
    configs:
      - source: rehearsal-ingress
        target: /etc/nginx/conf.d/default.conf
    networks: [backend, rehearsal-ingress]

networks:
  rehearsal-ingress: {}

configs:
  rehearsal-ingress:
    file: ./rehearsal/postgresql-ingress.conf
